<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayatımın Anlamı</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Hareketli koyu romantik arka plan */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #240b36, #1a0000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-playfair { font-family: 'Playfair Display', serif; }

        /* Cam efekti (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        /* Sayılar değişirken titrememesi için tabular-nums */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Kalp atışı animasyonu */
        .heartbeat {
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        /* Sayfa yüklendiğinde yavaşça gelme animasyonu */
        .fade-in-up {
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Giriş Blurlu Sürpriz Ekranı -->
    <div id="welcomeOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/85 backdrop-blur-xl cursor-pointer p-6 text-center transition-all duration-700">
        <div class="max-w-lg flex flex-col items-center">
            <i class="fa-solid fa-heart text-red-600 text-4xl mb-6 heartbeat drop-shadow-[0_0_20px_rgba(220,38,38,0.8)]"></i>
            <h2 class="text-2xl md:text-4xl font-playfair font-medium text-white/95 leading-relaxed mb-8">
                Ne zamandır hayatımı güzelleştiriyorsun biliyor musun?
            </h2>
            <div class="px-8 py-3 rounded-full bg-red-600/80 hover:bg-red-600 text-white font-medium text-sm tracking-widest uppercase transition-all transform hover:scale-105 border border-red-500/50 shadow-[0_0_25px_rgba(220,38,38,0.5)]">
                Öğrenmek İçin Tıkla ❤️
            </div>
        </div>
    </div>

    <main class="w-full max-w-4xl px-4 relative z-10 fade-in-up">
        
        <!-- Karşılama Mesajı -->
            <i class="fa-solid fa-heart text-red-600 text-3xl mb-6 heartbeat drop-shadow-[0_0_15px_rgba(220,38,38,0.8)]"></i>
            
            <h1 class="text-4xl md:text-6xl font-playfair font-semibold mb-3 tracking-wide text-white/90">
                Hoşgeldin Hayatımın Anlamı
            </h1>
            
            <div class="h-px w-24 bg-red-600/50 mx-auto my-6"></div>
            
            <!-- Sayaç Alanı -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8 w-full max-w-3xl mx-auto my-10">
                
                <!-- Gün -->
                <div class="flex flex-col items-center bg-black/30 rounded-xl p-4 md:p-6 border border-white/5">
                    <span id="days" class="text-5xl md:text-6xl font-bold text-white tabular-nums tracking-tight">0</span>
                    <span class="text-xs md:text-sm text-gray-400 mt-2 uppercase tracking-widest font-medium">Gün</span>
                </div>

                <!-- Saat -->
                <div class="flex flex-col items-center bg-black/30 rounded-xl p-4 md:p-6 border border-white/5">
                    <span id="hours" class="text-5xl md:text-6xl font-bold text-white tabular-nums tracking-tight">00</span>
                    <span class="text-xs md:text-sm text-gray-400 mt-2 uppercase tracking-widest font-medium">Saat</span>
                </div>

                <!-- Dakika -->
                <div class="flex flex-col items-center bg-black/30 rounded-xl p-4 md:p-6 border border-white/5">
                    <span id="minutes" class="text-5xl md:text-6xl font-bold text-white tabular-nums tracking-tight">00</span>
                    <span class="text-xs md:text-sm text-gray-400 mt-2 uppercase tracking-widest font-medium">Dakika</span>
                </div>

                <!-- Saniye -->
                <div class="flex flex-col items-center bg-black/30 rounded-xl p-4 md:p-6 border border-white/5">
                    <span id="seconds" class="text-5xl md:text-6xl font-bold text-red-400 tabular-nums tracking-tight">00</span>
                    <span class="text-xs md:text-sm text-gray-400 mt-2 uppercase tracking-widest font-medium">Saniye</span>
                </div>

            </div>

            <!-- Alt Yazı -->
            <p class="text-lg md:text-2xl font-playfair italic text-gray-300 mt-4 px-4">
                "<span id="startDateText" class="font-semibold text-white/80"></span> gününden beri hayatım mükemmel geçiyor..."
            </p>
            
            <p class="mt-8 text-sm text-gray-500 tracking-widest uppercase">
                Seni çok seviyorum
            </p>

        </div>

    </main>

    <!-- Arka Plan Müzik Oynatıcı (Gizli) -->
    <audio id="bgMusic" loop autoplay preload="auto">
        <source src="https://files.catbox.moe/8k6evq.mp3" type="audio/mpeg">
        Tarayıcınız ses elementini desteklemiyor.
    </audio>

    <script>
        // =====================================================================
        // BURAYI KENDİ ÇIKMAYA BAŞLADIĞINIZ TARİHE GÖRE DEĞİŞTİR!
        // Format: Yıl, Ay (0'dan başlar, yani Ocak 0, Eylül 8'dir), Gün, Saat, Dakika
        // =====================================================================
        
        // 11 Eylül 2026'ya ayarlandı! (Ay indeksinde 8, Eylül'e denk gelir)
        const baslangicTarihi = new Date(2026, 8, 11, 0, 0, 0); 
        
        // =====================================================================

        // Tarihi ekranda güzel görünmesi için formatla (Örn: 11 Eylül 2026)
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('startDateText').innerText = baslangicTarihi.toLocaleDateString('tr-TR', options);

        function updateCounter() {
            // Türkiye saat dilimine (Europe/Istanbul) göre anlık zamanı alıyoruz
            const simdiTR = new Date().toLocaleString("en-US", { timeZone: "Europe/Istanbul" });
            const now = new Date(simdiTR);
            
            const difference = now - baslangicTarihi;

            // Eğer gelecek bir tarih girilirse sayacı 0'da tut
            if (difference < 0) return;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);

            // HTML öğelerine yazdır (Tek haneli sayılara 0 ekle)
            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
        }

        // Sayfa yüklendiğinde ilk kez çalıştır
        updateCounter();

        // Her saniye başı güncelle
        setInterval(updateCounter, 1000);

        // =====================================================================
        // GİZLİ VE OTOMATİK MÜZİK SİSTEMİ
        // =====================================================================
        const bgMusic = document.getElementById('bgMusic');
        const welcomeOverlay = document.getElementById('welcomeOverlay');

        function openSite() {
            // Müziği başlat
            if (bgMusic) {
                bgMusic.play().catch(() => {});
            }
            
            // Blurlu katmanı yumuşakça kaldır
            if (welcomeOverlay) {
                welcomeOverlay.style.opacity = '0';
                welcomeOverlay.style.pointerEvents = 'none';
                setTimeout(() => {
                    welcomeOverlay.style.display = 'none';
                }, 700);
            }
        }

        if (welcomeOverlay) {
            welcomeOverlay.addEventListener('click', openSite);
            welcomeOverlay.addEventListener('touchstart', openSite);
        }
    </script>
</body>
</html>
